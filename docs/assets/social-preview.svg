<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Spanrail GitHub social preview card">
  <defs>
    <radialGradient id="spOcean" cx="20%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#2ea8d1" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#2ea8d1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050b0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spAmber" cx="85%" cy="76%" r="44%">
      <stop offset="0%" stop-color="#f2994a" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#f2994a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050b0f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="spGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f0f5f7" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#050b0f"/>
  <rect width="1280" height="640" fill="url(#spGrid)"/>
  <rect width="1280" height="640" fill="url(#spOcean)"/>
  <rect width="1280" height="640" fill="url(#spAmber)"/>

  <!-- Left Brand Block -->
  <g transform="translate(72, 84)">
    <polygon points="30,2 56,17 56,47 30,62 4,47 4,17" fill="#0c161c" stroke="#2ea8d1" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M39.5,21.5 C36.8,18.2 31.8,17.2 27.2,18.2 C22.5,19.2 20.5,22.5 22,26 C23.5,29.5 29,30.2 33.8,31.5 C38.5,32.8 40.8,36.2 39.2,40 C37.6,43.8 32.8,45.2 27.2,44.5 C23.2,44 20.6,42.2 19.2,40" fill="none" stroke="#f0f5f7" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="42.5" cy="18" r="3.4" fill="#f2994a"/>

    <text x="76" y="48" fill="#f0f5f7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="50" font-weight="600" letter-spacing="-1.6">Spanrail</text>

    <text x="0" y="144" fill="#f0f5f7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="500" letter-spacing="-1.1">AI agent observability</text>
    <text x="0" y="194" fill="#f0f5f7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="500" letter-spacing="-1.1">&amp; inline guardrails<tspan fill="#f2994a">.</tspan></text>

    <text x="0" y="250" fill="#93a6b1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Interactive trace waterfall, WebGL2 shaders, 3D neural</text>
    <text x="0" y="278" fill="#93a6b1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">telemetry, and mobile-native B2B product engineering.</text>

    <!-- 3 Headline Numbers -->
    <g transform="translate(0, 326)">
      <rect width="176" height="72" rx="14" fill="#0c161c" stroke="#f0f5f7" stroke-opacity="0.1"/>
      <text x="18" y="34" fill="#4cc0e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600">59.5 kB</text>
      <text x="18" y="56" fill="#93a6b1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">Home route bundle</text>

      <rect x="192" width="176" height="72" rx="14" fill="#0c161c" stroke="#f0f5f7" stroke-opacity="0.1"/>
      <text x="210" y="34" fill="#82d96e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600">0 alloc</text>
      <text x="210" y="56" fill="#93a6b1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">Per-frame WebGL2</text>

      <rect x="384" width="176" height="72" rx="14" fill="#0c161c" stroke="#f0f5f7" stroke-opacity="0.1"/>
      <text x="402" y="34" fill="#f6b06f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600">4.65:1+</text>
      <text x="402" y="56" fill="#93a6b1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">WCAG AA floor</text>
    </g>
  </g>

  <!-- Right Live Sandbox Card -->
  <g transform="translate(696, 84)">
    <rect width="512" height="404" rx="22" fill="#0c161c" stroke="#f0f5f7" stroke-opacity="0.12"/>
    <text x="26" y="42" fill="#f0f5f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Live Trace Sandbox</text>
    <rect x="398" y="21" width="88" height="28" rx="14" fill="#82d96e" fill-opacity="0.14"/>
    <circle cx="414" cy="35" r="3.5" fill="#82d96e"/>
    <text x="425" y="40" fill="#82d96e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500">Healthy</text>

    <line x1="0" y1="68" x2="512" y2="68" stroke="#f0f5f7" stroke-opacity="0.08"/>

    <g transform="translate(26, 92)">
      <text x="0" y="12" fill="#788d99" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">Latency (Refund Agent)</text>
      <text x="0" y="40" fill="#82d96e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600">780ms</text>
      <text x="90" y="40" fill="#788d99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">2,840ms</text>

      <line x1="214" y1="2" x2="214" y2="48" stroke="#f0f5f7" stroke-opacity="0.09"/>

      <text x="238" y="12" fill="#788d99" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">Per-run cost</text>
      <text x="238" y="40" fill="#82d96e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600">$0.014</text>
      <text x="338" y="40" fill="#788d99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">$0.048</text>
    </g>

    <line x1="0" y1="164" x2="512" y2="164" stroke="#f0f5f7" stroke-opacity="0.08"/>

    <g transform="translate(26, 194)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <circle cx="5" cy="5" r="3.5" fill="#2ea8d1"/>
      <text x="20" y="10" fill="#f0f5f7">agent.plan</text>
      <rect x="190" y="0" width="206" height="10" rx="3" fill="#14232b"/>
      <rect x="190" y="0" width="54" height="10" rx="3" fill="#2ea8d1"/>
      <text x="460" y="10" text-anchor="end" fill="#93a6b1">190ms</text>

      <g transform="translate(0, 48)">
        <circle cx="5" cy="5" r="3.5" fill="#82d96e"/>
        <text x="20" y="10" fill="#f0f5f7">guardrail.pii</text>
        <rect x="190" y="0" width="206" height="10" rx="3" fill="#14232b"/>
        <rect x="244" y="0" width="12" height="10" rx="3" fill="#82d96e"/>
        <text x="460" y="10" text-anchor="end" fill="#82d96e">4ms</text>
      </g>

      <g transform="translate(0, 96)">
        <circle cx="5" cy="5" r="3.5" fill="#2ea8d1"/>
        <text x="20" y="10" fill="#f0f5f7">tool.stripe</text>
        <rect x="190" y="0" width="206" height="10" rx="3" fill="#14232b"/>
        <rect x="256" y="0" width="76" height="10" rx="3" fill="#2ea8d1"/>
        <text x="460" y="10" text-anchor="end" fill="#93a6b1">306ms</text>
      </g>

      <g transform="translate(0, 144)">
        <circle cx="5" cy="5" r="3.5" fill="#82d96e"/>
        <text x="20" y="10" fill="#f0f5f7">llm.cached</text>
        <rect x="190" y="0" width="206" height="10" rx="3" fill="#14232b"/>
        <rect x="332" y="0" width="64" height="10" rx="3" fill="#82d96e"/>
        <text x="460" y="10" text-anchor="end" fill="#82d96e">280ms</text>
      </g>
    </g>
  </g>

  <!-- Bottom Rail -->
  <g transform="translate(72, 540)">
    <line x1="0" y1="0" x2="1136" y2="0" stroke="#f0f5f7" stroke-opacity="0.1"/>
    <text x="0" y="34" fill="#93a6b1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Next.js 15 · React 19 · TypeScript · WebGL2 · Three.js · OpenTelemetry</text>
    <text x="1136" y="34" text-anchor="end" fill="#4cc0e6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14.5" font-weight="500">spanrail.vercel.app · Sparsh Parwani</text>
  </g>
</svg>