<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Spanrail — OpenTelemetry-native AI agent observability and inline guardrails">
  <defs>
    <radialGradient id="glowOceanL" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.11"/>
      <stop offset="55%" stop-color="#0e7490" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#f3f7f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmberL" cx="84%" cy="80%" r="42%">
      <stop offset="0%" stop-color="#d97724" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#d97724" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#f3f7f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGridL" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#091318" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Tinted Off-White Canvas -->
  <rect width="1280" height="360" rx="20" fill="#f3f7f9"/>
  <rect width="1280" height="360" rx="20" fill="url(#dotGridL)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glowOceanL)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glowAmberL)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#091318" stroke-opacity="0.1"/>

  <!-- Left: Brand & Value Prop -->
  <g transform="translate(56, 46)">
    <g transform="translate(0, 0)">
      <polygon points="24,2 44,13.5 44,36.5 24,48 4,36.5 4,13.5" fill="#091318" stroke="#0e7490" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M31.5,17.2 C29.5,14.8 25.5,14 21.8,14.8 C18.2,15.6 16.5,18.2 17.6,20.8 C18.7,23.4 23.2,23.9 26.8,25 C30.6,26.1 32.5,28.7 31.3,31.6 C30.1,34.5 26.2,35.8 21.8,35.2 C18.6,34.8 16.5,33.4 15.5,31.6" fill="none" stroke="#f0f5f7" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="33.5" cy="14.5" r="2.6" fill="#f2994a"/>
    </g>

    <text x="62" y="37" fill="#091318" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="600" letter-spacing="-1.2">Spanrail</text>

    <g transform="translate(0, 68)">
      <rect width="348" height="28" rx="14" fill="#ffffff" stroke="#091318" stroke-opacity="0.1"/>
      <circle cx="15" cy="14" r="3.5" fill="#15803d"/>
      <text x="27" y="18" fill="#475a66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">OpenTelemetry native · Next.js 15 · WebGL2</text>
    </g>

    <text x="0" y="138" fill="#091318" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="29" font-weight="600" letter-spacing="-0.8">See every agent step. Stop slow runs</text>
    <text x="0" y="174" fill="#091318" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="29" font-weight="600" letter-spacing="-0.8">and surprise bills<tspan fill="#c96a1b">.</tspan></text>

    <text x="0" y="210" fill="#475a66" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5">Real-time trace inspection, inline PII &amp; loop guardrails, and exact token accounting.</text>

    <g transform="translate(0, 236)">
      <rect width="182" height="34" rx="10" fill="#ffffff" stroke="#091318" stroke-opacity="0.1"/>
      <text x="14" y="21" fill="#0e7490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">1.4ms</text>
      <text x="59" y="21" fill="#475a66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">router pipeline</text>

      <rect x="194" width="206" height="34" rx="10" fill="#ffffff" stroke="#091318" stroke-opacity="0.1"/>
      <text x="208" y="21" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">0 alloc/f</text>
      <text x="282" y="21" fill="#475a66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">WebGL2 RGBA16F</text>

      <rect x="412" width="212" height="34" rx="10" fill="#ffffff" stroke="#091318" stroke-opacity="0.1"/>
      <text x="426" y="21" fill="#c96a1b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">11/11</text>
      <text x="472" y="21" fill="#475a66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">routes · 0 TS errors</text>
    </g>
  </g>

