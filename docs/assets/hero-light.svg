      <text x="262" y="30" fill="#5b6f7b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">from $0.048</text>

      <text x="452" y="29" text-anchor="end" fill="#c96a1b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">-72.5%</text>
    </g>

    <line x1="0" y1="114" x2="496" y2="114" stroke="#091318" stroke-opacity="0.08"/>

    <g transform="translate(22, 134)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
      <circle cx="4" cy="4" r="3" fill="#0e7490"/>
      <text x="16" y="8" fill="#091318">agent.plan</text>
      <rect x="176" y="0" width="214" height="8" rx="3" fill="#e6eef2"/>
      <rect x="176" y="0" width="52" height="8" rx="3" fill="#0e7490"/>
      <text x="452" y="8" text-anchor="end" fill="#475a66">190ms</text>

      <g transform="translate(0, 34)">
        <circle cx="4" cy="4" r="3" fill="#15803d"/>
        <text x="16" y="8" fill="#091318">guardrail.pii_simd</text>
        <rect x="176" y="0" width="214" height="8" rx="3" fill="#e6eef2"/>
        <rect x="228" y="0" width="12" height="8" rx="3" fill="#15803d"/>
        <text x="452" y="8" text-anchor="end" fill="#15803d">4ms</text>
      </g>

      <g transform="translate(0, 68)">
        <circle cx="4" cy="4" r="3" fill="#0e7490"/>
        <text x="16" y="8" fill="#091318">tool.stripe_refund</text>
        <rect x="176" y="0" width="214" height="8" rx="3" fill="#e6eef2"/>
        <rect x="240" y="0" width="84" height="8" rx="3" fill="#0e7490"/>
        <text x="452" y="8" text-anchor="end" fill="#475a66">306ms</text>
      </g>

      <g transform="translate(0, 102)">
        <circle cx="4" cy="4" r="3" fill="#15803d"/>
        <text x="16" y="8" fill="#091318">llm.cached_reply</text>
        <rect x="176" y="0" width="214" height="8" rx="3" fill="#e6eef2"/>
        <rect x="324" y="0" width="66" height="8" rx="3" fill="#15803d"/>
        <text x="452" y="8" text-anchor="end" fill="#15803d">280ms</text>
      </g>
