    <line x1="0" y1="52" x2="496" y2="52" stroke="#091318" stroke-opacity="0.08"/>

    <g transform="translate(22, 68)">
      <text x="0" y="10" fill="#5b6f7b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Total latency</text>
      <text x="0" y="30" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600">780ms</text>
      <text x="64" y="30" fill="#5b6f7b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">from 2,840ms</text>

      <line x1="176" y1="2" x2="176" y2="34" stroke="#091318" stroke-opacity="0.09"/>

      <text x="194" y="10" fill="#5b6f7b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Run cost</text>
