<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Spanrail — OpenTelemetry-native AI agent observability and inline guardrails">
  <defs>
    <radialGradient id="glowOcean" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#2ea8d1" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#2ea8d1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050b0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="84%" cy="80%" r="42%">
      <stop offset="0%" stop-color="#f2994a" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#f2994a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050b0f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f0f5f7" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="360" rx="20" fill="#050b0f"/>
  <rect width="1280" height="360" rx="20" fill="url(#dotGrid)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glowOcean)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glowAmber)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#f0f5f7" stroke-opacity="0.1"/>

  <!-- Left: Brand & Value Prop -->
  <g transform="translate(56, 46)">
    <!-- Hexagon S Brand Mark -->
    <g transform="translate(0, 0)">
      <polygon points="24,2 44,13.5 44,36.5 24,48 4,36.5 4,13.5" fill="#0c161c" stroke="#2ea8d1" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M31.5,17.2 C29.5,14.8 25.5,14 21.8,14.8 C18.2,15.6 16.5,18.2 17.6,20.8 C18.7,23.4 23.2,23.9 26.8,25 C30.6,26.1 32.5,28.7 31.3,31.6 C30.1,34.5 26.2,35.8 21.8,35.2 C18.6,34.8 16.5,33.4 15.5,31.6" fill="none" stroke="#f0f5f7" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="33.5" cy="14.5" r="2.6" fill="#f2994a"/>
    </g>

    <text x="62" y="37" fill="#f0f5f7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="600" letter-spacing="-1.2">Spanrail</text>

    <!-- Quiet Status Tag -->
    <g transform="translate(0, 68)">
      <rect width="348" height="28" rx="14" fill="#0c161c" stroke="#f0f5f7" stroke-opacity="0.1"/>
      <circle cx="15" cy="14" r="3.5" fill="#82d96e"/>
      <text x="27" y="18" fill="#93a6b1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">OpenTelemetry native · Next.js 15 · WebGL2</text>
    </g>

    <!-- Headline -->
    <text x="0" y="138" fill="#f0f5f7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="29" font-weight="500" letter-spacing="-0.8">See every agent step. Stop slow runs</text>
    <text x="0" y="174" fill="#f0f5f7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="29" font-weight="500" letter-spacing="-0.8">and surprise bills<tspan fill="#f2994a">.</tspan></text>

    <!-- Subcopy -->
    <text x="0" y="210" fill="#93a6b1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5">Real-time trace inspection, inline PII &amp; loop guardrails, and exact token accounting.</text>

    <!-- Bottom Verified Spec Chips -->
    <g transform="translate(0, 236)">
      <rect width="182" height="34" rx="10" fill="#0c161c" stroke="#f0f5f7" stroke-opacity="0.09"/>
      <text x="14" y="21" fill="#4cc0e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">1.4ms</text>
      <text x="59" y="21" fill="#93a6b1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">router pipeline</text>

      <rect x="194" width="206" height="34" rx="10" fill="#0c161c" stroke="#f0f5f7" stroke-opacity="0.09"/>
      <text x="208" y="21" fill="#82d96e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">0 alloc/f</text>
      <text x="282" y="21" fill="#93a6b1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">WebGL2 RGBA16F</text>

      <rect x="412" width="212" height="34" rx="10" fill="#0c161c" stroke="#f0f5f7" stroke-opacity="0.09"/>
      <text x="426" y="21" fill="#f6b06f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">11/11</text>
      <text x="472" y="21" fill="#93a6b1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">routes · 0 TS errors</text>
    </g>
  </g>

  <!-- Right: Live Trace Waterfall Preview Card -->
  <g transform="translate(728, 40)">
    <rect width="496" height="280" rx="18" fill="#0c161c" stroke="#f0f5f7" stroke-opacity="0.12"/>

    <!-- Card Header -->
    <text x="22" y="32" fill="#f0f5f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600">Refund Agent</text>
    <text x="122" y="32" fill="#788d99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">tr_8f91c · 3/3 guardrails</text>
    <rect x="398" y="15" width="76" height="24" rx="12" fill="#82d96e" fill-opacity="0.14"/>
    <circle cx="412" cy="27" r="3" fill="#82d96e"/>
    <text x="421" y="31" fill="#82d96e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="500">Healthy</text>

    <line x1="0" y1="52" x2="496" y2="52" stroke="#f0f5f7" stroke-opacity="0.08"/>

    <!-- Telemetry Summary Strip -->
    <g transform="translate(22, 68)">
      <text x="0" y="10" fill="#788d99" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Total latency</text>
      <text x="0" y="30" fill="#82d96e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600">780ms</text>
      <text x="64" y="30" fill="#788d99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">from 2,840ms</text>

      <line x1="176" y1="2" x2="176" y2="34" stroke="#f0f5f7" stroke-opacity="0.09"/>

      <text x="194" y="10" fill="#788d99" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Run cost</text>
      <text x="194" y="30" fill="#82d96e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600">$0.014</text>
      <text x="262" y="30" fill="#788d99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">from $0.048</text>

      <text x="452" y="29" text-anchor="end" fill="#f6b06f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">-72.5%</text>
    </g>

    <line x1="0" y1="114" x2="496" y2="114" stroke="#f0f5f7" stroke-opacity="0.08"/>

    <!-- Waterfall Spans -->
    <g transform="translate(22, 134)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
      <!-- Span 1 -->
      <circle cx="4" cy="4" r="3" fill="#2ea8d1"/>
      <text x="16" y="8" fill="#f0f5f7">agent.plan</text>
      <rect x="176" y="0" width="214" height="8" rx="3" fill="#14232b"/>
      <rect x="176" y="0" width="52" height="8" rx="3" fill="#2ea8d1"/>
      <text x="452" y="8" text-anchor="end" fill="#93a6b1">190ms</text>

      <!-- Span 2 -->
      <g transform="translate(0, 34)">
        <circle cx="4" cy="4" r="3" fill="#82d96e"/>
        <text x="16" y="8" fill="#f0f5f7">guardrail.pii_simd</text>
        <rect x="176" y="0" width="214" height="8" rx="3" fill="#14232b"/>
        <rect x="228" y="0" width="12" height="8" rx="3" fill="#82d96e"/>
        <text x="452" y="8" text-anchor="end" fill="#82d96e">4ms</text>
      </g>

      <!-- Span 3 -->
      <g transform="translate(0, 68)">
        <circle cx="4" cy="4" r="3" fill="#2ea8d1"/>
        <text x="16" y="8" fill="#f0f5f7">tool.stripe_refund</text>
        <rect x="176" y="0" width="214" height="8" rx="3" fill="#14232b"/>
        <rect x="240" y="0" width="84" height="8" rx="3" fill="#2ea8d1"/>
        <text x="452" y="8" text-anchor="end" fill="#93a6b1">306ms</text>
      </g>

      <!-- Span 4 -->
      <g transform="translate(0, 102)">
        <circle cx="4" cy="4" r="3" fill="#82d96e"/>
        <text x="16" y="8" fill="#f0f5f7">llm.cached_reply</text>
        <rect x="176" y="0" width="214" height="8" rx="3" fill="#14232b"/>
        <rect x="324" y="0" width="66" height="8" rx="3" fill="#82d96e"/>
        <text x="452" y="8" text-anchor="end" fill="#82d96e">280ms</text>
      </g>
    </g>
  </g>
</svg>